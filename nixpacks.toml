# ---------------------------------------------------------------------------
# Configuration Nixpacks — déploiement Railway (E-Intendance LISI)
#
# Prérequis : Railway → service de l'app → Settings → Build → Builder = "Nixpacks".
# Si le builder est "Railpack" (défaut récent de Railway), ce fichier est IGNORÉ
# (Railpack lit alors "engines.node" de package.json pour la version de Node).
#
# Extensions PHP : gérées via la variable Railway NIXPACKS_PHP_EXTENSIONS=gd,zip
# ---------------------------------------------------------------------------

# Node 20 : Vite 8 / rolldown utilise CustomEvent, absent de Node 18
# ("ReferenceError: CustomEvent is not defined" au build).
[phases.setup]
nixPkgs = ["nodejs_20"]

# Build : dépendances front + compilation des assets (public/build/).
# Pas de `config:cache` ici : les variables d'env Railway ne sont pas garanties
# au build. Le cache config est fait au démarrage (Procfile).
[phases.build]
cmds = [
  "npm ci",
  "npm run build",
  "php artisan view:cache"
]
