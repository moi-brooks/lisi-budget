# ---------------------------------------------------------------------------
# Configuration Nixpacks — déploiement Railway (E-Intendance LISI)
#
# Prérequis : Railway → service de l'app → Settings → Build → Builder = "Nixpacks".
# Si le builder est "Railpack" (défaut récent de Railway), ce fichier est IGNORÉ.
#
# Extensions PHP : gérées via la variable Railway NIXPACKS_PHP_EXTENSIONS=gd,zip
# (Nixpacks les active automatiquement, pas besoin d'install-php-extensions ici).
# ---------------------------------------------------------------------------

# Build : dépendances front + compilation des assets (public/build/).
# Pas de `config:cache` ici : les variables d'env Railway (APP_URL, DB_*) ne sont
# pas garanties au build → config figée fausse. Le cache config est fait au
# démarrage (Procfile).
[phases.build]
cmds = [
  "npm ci",
  "npm run build",
  "php artisan view:cache"
]
