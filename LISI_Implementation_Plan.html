<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LISI Budget — Plan d'Implémentation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6fb;color:#1a1a2e;min-height:100vh;padding:24px 16px 48px}
.root{max-width:900px;margin:0 auto}
header{background:#1F4E79;color:#fff;border-radius:10px 10px 0 0;padding:22px 28px 16px}
header h1{font-size:19px;font-weight:700}
header p{font-size:12px;opacity:.7;margin-top:4px}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#fff;border:1px solid #dde3ed;border-top:none;padding:16px 20px}
.stat{background:#f4f6fb;border-radius:8px;padding:10px 14px}
.stat-label{font-size:11px;color:#6b7a99;margin-bottom:3px}
.stat-val{font-size:22px;font-weight:700;color:#1F4E79}
.global-progress{height:6px;background:#e0e6f0;border-radius:3px;overflow:hidden;margin:0 20px 0}
.global-progress-fill{height:100%;background:#1F4E79;border-radius:3px;transition:width .4s}
.phases{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.phase-wrap{border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.phase-header{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;background:#fff;border:1px solid #dde3ed;transition:background .15s;user-select:none}
.phase-header:hover{background:#f8f9fb}
.phase-body{display:none;background:#fff;border:1px solid #dde3ed;border-top:none;border-radius:0 0 10px 10px}
.phase-body.open{display:block}
.phase-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.phase-title{font-size:14px;font-weight:600;flex:1}
.phase-hours{font-size:12px;color:#6b7a99;margin-right:4px}
.phase-pct{font-size:13px;font-weight:700;min-width:36px;text-align:right}
.chevron{font-size:20px;color:#9aa5bc;transition:transform .2s;flex-shrink:0}
.chevron.open{transform:rotate(90deg)}
.phase-progress-row{padding:0 18px 10px;display:flex;align-items:center;gap:10px}
.phase-progress-bg{flex:1;height:4px;background:#e8edf5;border-radius:2px;overflow:hidden}
.phase-progress-fill{height:100%;border-radius:2px;transition:width .4s}
.deliverables{padding:8px 18px 6px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #edf0f7}
.del-badge{font-size:11px;padding:3px 9px;border-radius:12px;background:#e8f0fb;color:#185FA5;border:1px solid #b5d4f4}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 18px;border-bottom:1px solid #f0f2f8;cursor:pointer;transition:background .12s}
.task-row:last-child{border-bottom:none}
.task-row:hover{background:#f8f9fb}
.cb{width:18px;height:18px;border:1.5px solid #b5bfd4;border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cb.done{background:#1D9E75;border-color:#1D9E75}
.tick{display:none;color:#fff;font-size:12px;font-weight:700;line-height:1}
.cb.done .tick{display:block}
.task-info{flex:1;min-width:0}
.task-title{font-size:13px;font-weight:600;line-height:1.4}
.task-title.done{color:#9aa5bc;text-decoration:line-through}
.cmd-box{margin-top:5px;font-family:'Courier New',monospace;font-size:11px;background:#f4f6fb;border:1px solid #dde3ed;border-radius:5px;padding:5px 10px;color:#444;cursor:pointer;transition:border-color .15s;word-break:break-all;position:relative}
.cmd-box:hover{border-color:#185FA5}
.cmd-box.copied{border-color:#1D9E75;color:#0F6E56}
.copy-hint{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#9aa5bc}
.reset-btn{margin-top:20px;padding:8px 20px;border:1.5px solid #dde3ed;border-radius:8px;background:#fff;color:#6b7a99;font-size:13px;cursor:pointer;transition:all .15s}
.reset-btn:hover{border-color:#E24B4A;color:#A32D2D}
.footer-note{margin-top:10px;font-size:11px;color:#9aa5bc;text-align:center}
@media(max-width:560px){.stats-bar{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="root">

<header>
  <h1>Plan d'Implémentation — LISI Budget App</h1>
  <p>Laravel 11 · PHP 8.2 · MySQL 8 · Blade · Tailwind CSS · ~28 heures de développement</p>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-label">Phases</div><div class="stat-val">6</div></div>
  <div class="stat"><div class="stat-label">Tâches totales</div><div class="stat-val" id="s-total">0</div></div>
  <div class="stat"><div class="stat-label">Complétées</div><div class="stat-val" id="s-done">0</div></div>
  <div class="stat"><div class="stat-label">Progression</div><div class="stat-val" id="s-pct">0%</div></div>
</div>

<div style="background:#fff;border:1px solid #dde3ed;border-top:none;padding:8px 20px 12px">
  <div class="global-progress" style="margin:0">
    <div class="global-progress-fill" id="global-bar" style="width:0%"></div>
  </div>
</div>

<div class="phases" id="phases-container"></div>

<div style="text-align:center;margin-top:16px">
  <button class="reset-btn" onclick="resetAll()">Réinitialiser la progression</button>
  <div class="footer-note">La progression est sauvegardée localement dans votre navigateur.</div>
</div>

</div>
<script>
const PHASES = [
  {
    id:'p1',
    label:'Phase 1 — Environnement & installation',
    color:'#185FA5', bg:'#E6F1FB', textColor:'#0C447C',
    hours:'2–3h',
    deliverables:['PHP 8.2 installé','MySQL + DB créée','Laravel 11 opérationnel','Tailwind compilé'],
    tasks:[
      {t:'Installer PHP 8.2 + extensions requises',     c:'sudo apt install php8.2 php8.2-cli php8.2-mysql php8.2-xml php8.2-mbstring php8.2-curl php8.2-zip php8.2-bcmath unzip -y'},
      {t:'Installer Composer (gestionnaire de paquets)',c:'curl -sS https://getcomposer.org/installer | php && sudo mv composer.phar /usr/local/bin/composer'},
      {t:'Installer MySQL 8 + créer la base de données',c:'sudo apt install mysql-server -y && sudo mysql -e "CREATE DATABASE lisi_budget CHARACTER SET utf8mb4;"'},
      {t:'Créer l\'utilisateur MySQL lisi',             c:'sudo mysql -e "CREATE USER \'lisi\'@\'localhost\' IDENTIFIED BY \'secret\'; GRANT ALL ON lisi_budget.* TO \'lisi\'@\'localhost\';"'},
      {t:'Créer le projet Laravel 11',                  c:'composer create-project laravel/laravel lisi-budget && cd lisi-budget'},
      {t:'Configurer .env — DB + APP_NAME',             c:'DB_DATABASE=lisi_budget  |  DB_USERNAME=lisi  |  DB_PASSWORD=secret  |  APP_NAME="LISI Budget"'},
      {t:'Installer Node.js + npm',                     c:'sudo apt install nodejs npm -y'},
      {t:'Installer Tailwind CSS via Vite',             c:'npm install -D tailwindcss postcss autoprefixer && npx tailwindcss init -p && npm run dev'},
      {t:'Vérifier que le serveur de développement tourne', c:'php artisan serve  →  ouvrir http://localhost:8000'},
    ]
  },
  {
    id:'p2',
    label:'Phase 2 — Base de données (migrations + modèles + seeders)',
    color:'#0F6E56', bg:'#E1F5EE', textColor:'#04342C',
    hours:'4–5h',
    deliverables:['9 migrations en ordre','8 modèles Eloquent + relations','Seeder 12 rubriques Excel','AdminSeeder'],
    tasks:[
      {t:'Migration users — ajouter colonne role (enum admin/emetteur)',  c:'php artisan make:migration add_role_to_users_table --table=users'},
      {t:'Migration budgets (annee, saison, total, administrateur_id)',   c:'php artisan make:migration create_budgets_table'},
      {t:'Migration emetteurs (user_id FK, budget_id FK, dotation)',      c:'php artisan make:migration create_emetteurs_table'},
      {t:'Migration fournisseurs (nom, adresse) — catalogue admin',       c:'php artisan make:migration create_fournisseurs_table'},
      {t:'Migration ligne_budgetaires (article, paragraphe, rubrique, code_ligne, nom)', c:'php artisan make:migration create_ligne_budgetaires_table'},
      {t:'Migration ligne_budget_proposees (montant, statut enum, motif_refus, nb_refus, validated_at)', c:'php artisan make:migration create_ligne_budget_proposees_table'},
      {t:'Migration engagements (tva, total_ht, total_ttc, statut enum, motif_refus)', c:'php artisan make:migration create_engagements_table'},
      {t:'Migration besoins (intitule, quantite, prix_unitaire, montant, is_delivered boolean)', c:'php artisan make:migration create_besoins_table'},
      {t:'Créer les 8 modèles Eloquent avec $fillable et relations',      c:'php artisan make:model Budget && make:model Emetteur && make:model LigneBudgetaire && make:model LigneBudgetProposee && make:model Engagement && make:model Besoin && make:model Fournisseur'},
      {t:'Écrire LigneBudgetaireSeeder — 12 rubriques du fichier Excel',  c:'php artisan make:seeder LigneBudgetaireSeeder  — données issues du fichier Ventillation_dotation_par_rubriques.xlsx'},
      {t:'Écrire AdminSeeder — compte administrateur initial',            c:'php artisan make:seeder AdminSeeder  — admin@lisi.ma / password (à changer en prod)'},
      {t:'Enregistrer les seeders dans DatabaseSeeder.php',              c:'$this->call([AdminSeeder::class, LigneBudgetaireSeeder::class]);'},
      {t:'Lancer migrations + seeders et vérifier',                       c:'php artisan migrate --seed && php artisan tinker  →  LigneBudgetaire::count() == 12'},
    ]
  },
  {
    id:'p3',
    label:'Phase 3 — Authentification & middleware de rôle',
    color:'#534AB7', bg:'#EEEDFE', textColor:'#26215C',
    hours:'2h',
    deliverables:['Laravel Breeze (login/logout)','Middleware CheckRole','Groupes de routes protégés','Redirect post-login par rôle'],
    tasks:[
      {t:'Scaffolder Laravel Breeze (Blade + Tailwind)',          c:'composer require laravel/breeze --dev && php artisan breeze:install blade && npm run build'},
      {t:'Créer le middleware CheckRole',                          c:'php artisan make:middleware CheckRole'},
      {t:'Implémenter la logique CheckRole (abort 403 si rôle incorrect)', c:'if (auth()->user()->role !== $role) abort(403, "Accès non autorisé");'},
      {t:'Enregistrer CheckRole dans bootstrap/app.php',          c:'->withMiddleware(fn($m) => $m->alias([\'role\' => CheckRole::class]))'},
      {t:'Définir les 3 groupes de routes dans routes/web.php',   c:'Route::middleware([\'auth\',\'role:admin\'])->prefix(\'admin\')  +  prefix(\'emetteur\')'},
      {t:'Customiser LoginResponse — redirect selon le rôle',     c:'admin → /admin/dashboard  |  emetteur → /emetteur/dashboard'},
      {t:'Tester : login admin, login émetteur, accès cross-role', c:'Vérifier que /admin/* retourne 403 depuis un compte emetteur'},
    ]
  },
  {
    id:'p4',
    label:'Phase 4 — Contrôleurs & logique métier',
    color:'#854F0B', bg:'#FAEEDA', textColor:'#412402',
    hours:'8–10h',
    deliverables:['11 contrôleurs','6 Form Requests','Workflow approve/reject complet','Calculs auto (reliquat, total_ttc)','Toutes les routes testées'],
    tasks:[
      {t:'Admin: DashboardController — statistiques globales',           c:'php artisan make:controller Admin/DashboardController'},
      {t:'Admin: BudgetController — CRUD budget annuel',                 c:'php artisan make:controller Admin/BudgetController --resource'},
      {t:'Admin: EmetteurController — CRUD + assignation dotation',      c:'php artisan make:controller Admin/EmetteurController --resource'},
      {t:'Admin: FournisseurController — catalogue fournisseurs',        c:'php artisan make:controller Admin/FournisseurController --resource'},
      {t:'Admin: PropositionController — approve() + reject()',          c:'php artisan make:controller Admin/PropositionController'},
      {t:'Admin: EngagementController — setTva() + approve() + reject()', c:'php artisan make:controller Admin/EngagementController'},
      {t:'Emetteur: DashboardController — dotation + reliquat',          c:'php artisan make:controller Emetteur/DashboardController'},
      {t:'Emetteur: LigneProposeeController — CRUD propositions',        c:'php artisan make:controller Emetteur/LigneProposeeController --resource'},
      {t:'Emetteur: EngagementController — CRUD engagements (BC)',       c:'php artisan make:controller Emetteur/EngagementController --resource'},
      {t:'Emetteur: BesoinController — ajout/modif/suppression lignes BC', c:'php artisan make:controller Emetteur/BesoinController'},
      {t:'Emetteur: LivraisonController — UPDATE is_delivered = true',  c:'php artisan make:controller Emetteur/LivraisonController'},
      {t:'Form Request: StoreBudgetRequest',                              c:'php artisan make:request StoreBudgetRequest  — annee|total|saison requis'},
      {t:'Form Request: StoreEmetteurRequest (email unique)',             c:'php artisan make:request StoreEmetteurRequest  — email: unique:users'},
      {t:'Form Request: StorePropositionRequest',                         c:'php artisan make:request StorePropositionRequest  — montant: numeric|min:1'},
      {t:'Form Request: RejectRequest — motif_refus obligatoire',        c:'php artisan make:request RejectRequest  — motif_refus: required|string|min:10'},
      {t:'Form Requests: StoreEngagementRequest + StoreBesoinRequest',   c:'php artisan make:request StoreEngagementRequest && make:request StoreBesoinRequest'},
      {t:'Méthode getReliquat() sur modèle Emetteur',                    c:'return $this->dotation - $this->engagements()->where(\'statut\',\'approuve\')->sum(\'total_ttc\');'},
      {t:'Observer BesoinObserver — recalcul total_ht à chaque mutation', c:'php artisan make:observer BesoinObserver --model=Besoin'},
      {t:'Logique total_ttc dans Engagement::setTva()',                  c:'$this->total_ttc = $this->total_ht * (1 + $tva / 100);'},
      {t:'Compléter routes/web.php et vérifier toutes les routes',       c:'php artisan route:list  →  toutes les routes admin/* et emetteur/* présentes'},
    ]
  },
  {
    id:'p5',
    label:'Phase 5 — Vues Blade & interface utilisateur',
    color:'#993C1D', bg:'#FAECE7', textColor:'#4A1B0C',
    hours:'6–8h',
    deliverables:['Layout principal + sidebar','2 dashboards (admin + émetteur)','Tous les formulaires CRUD','Statuts colorés orange/vert/rouge','Charts Chart.js','Responsive OK'],
    tasks:[
      {t:'Layout principal: layouts/app.blade.php (sidebar contextuelle par rôle)', c:'resources/views/layouts/app.blade.php  — @auth + role switch pour sidebar'},
      {t:'Composant Blade: x-status-badge (orange=en_attente, vert=approuve, rouge=rejete)', c:'php artisan make:component StatusBadge  — couleur automatique selon statut'},
      {t:'Composant Blade: x-modal-reject (modale motif de refus)',       c:'Alpine.js x-data="{ open: false }" x-show="open" pour la modale'},
      {t:'Admin: dashboard — donut Chart.js + tableau émetteurs dépensé/restant', c:'resources/views/admin/dashboard.blade.php  — budget global + liste engagements récents'},
      {t:'Admin: budget/index + create + edit + show',                    c:'resources/views/admin/budget/  — liste budgets, formulaire création, édition'},
      {t:'Admin: emetteur/index + create + edit',                         c:'resources/views/admin/emetteur/  — liste émetteurs, création avec dotation, édition'},
      {t:'Admin: proposition/index — onglets En attente / Approuvées / Rejetées', c:'Filtrage par statut avec compteurs, boutons Approuver + Rejeter + modale motif'},
      {t:'Admin: engagement/index + show — champ TVA + approbation',     c:'resources/views/admin/engagement/  — détail BC, champ tva, boutons approve/reject'},
      {t:'Emetteur: dashboard — jauge dotation + reliquat + lignes approuvées', c:'resources/views/emetteur/dashboard.blade.php  — statistiques personnelles émetteur'},
      {t:'Emetteur: ligne/index — statuts colorés + compteur nb_refus',  c:'resources/views/emetteur/ligne/index.blade.php  — liste avec motif de refus au survol'},
      {t:'Emetteur: ligne/create — dropdown 12 rubriques + saisie montant', c:'resources/views/emetteur/ligne/create.blade.php  — select rubriques depuis DB'},
      {t:'Emetteur: engagement/create — ajout besoins dynamique JS (auto-calcul)', c:'Lignes besoin ajoutables via JS, total_ht calculé côté client avant soumission'},
      {t:'Emetteur: engagement/show + suivi livraison (cases à cocher)',  c:'PATCH ajax sur /besoins/{id}/livraison → is_delivered = true sans rechargement'},
      {t:'Intégrer Chart.js pour les graphiques',                         c:'<script src="https://cdn.jsdelivr.net/npm/chart.js"> — donut budget + barres par émetteur'},
      {t:'Vérifier responsive mobile (sidebar collapse, tableaux)',       c:'Tester sur mobile/tablette — sidebar cachée + tableaux scrollables horizontalement'},
    ]
  },
  {
    id:'p6',
    label:'Phase 6 — Tests, polish & déploiement',
    color:'#5F5E5A', bg:'#F1EFE8', textColor:'#2C2C2A',
    hours:'3–4h',
    deliverables:['Workflow complet testé','Sécurité cross-role vérifiée','Calculs validés','README.md','Build production OK'],
    tasks:[
      {t:'Test workflow complet Admin (budget → émetteur → approbation)', c:'Créer budget → assigner émetteur → approuver proposition → fixer TVA → approuver engagement'},
      {t:'Test workflow complet Émetteur (proposer → BC → livraison)',    c:'Proposer ligne → valider sélection → créer BC avec besoins → marquer articles livrés'},
      {t:'Test sécurité cross-role (403 obligatoire)',                    c:'Vérifier que /admin/* retourne 403 depuis compte émetteur — et vice-versa'},
      {t:'Test validation formulaires (champs manquants, motif vide)',    c:'Soumettre formulaires incomplets → vérifier messages d\'erreur Blade visibles'},
      {t:'Vérifier calcul reliquat après approbation d\'engagements',    c:'reliquat = dotation - SUM(engagements.total_ttc WHERE statut=approuve) — doit être exact'},
      {t:'Vérifier auto-calcul total_ttc avec différents taux TVA',      c:'Tester tva=0%, 10%, 20% → vérifier que total_ttc = total_ht × (1 + tva/100)'},
      {t:'Vérifier le compteur nb_refus sur les propositions rejetées',  c:'Rejeter 2 fois → nb_refus doit valoir 2 en base et s\'afficher dans la vue'},
      {t:'Rédiger README.md (installation + identifiants par défaut)',   c:'Instructions php artisan migrate --seed + admin@lisi.ma / password + screenshot'},
      {t:'Compiler les assets pour la production',                        c:'npm run build  — CSS et JS minifiés dans public/build/'},
      {t:'Test final sur serveur propre (migrate:fresh --seed)',          c:'php artisan migrate:fresh --seed && php artisan serve  — zéro erreur 500'},
    ]
  },
];

const SK = 'lisi_impl_plan_v2';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(SK) || '{}'); } catch(e) {}

function persist() { try { localStorage.setItem(SK, JSON.stringify(saved)); } catch(e) {} }

function updateStats() {
  let total = 0, done = 0;
  PHASES.forEach(ph => {
    ph.tasks.forEach((_, ti) => {
      total++;
      if (saved[ph.id + '_' + ti]) done++;
    });
  });
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('s-pct').textContent = pct + '%';
  document.getElementById('global-bar').style.width = pct + '%';

  PHASES.forEach(ph => {
    const phTotal = ph.tasks.length;
    const phDone = ph.tasks.filter((_, ti) => saved[ph.id + '_' + ti]).length;
    const phPct = phTotal ? Math.round(phDone / phTotal * 100) : 0;
    const bar = document.getElementById('pbar_' + ph.id);
    const pctEl = document.getElementById('ppct_' + ph.id);
    if (bar) bar.style.width = phPct + '%';
    if (pctEl) pctEl.textContent = phDone + '/' + phTotal;
  });
}

function toggleTask(phId, ti) {
  const key = phId + '_' + ti;
  saved[key] = !saved[key];
  persist();
  const cb = document.getElementById('cb_' + phId + '_' + ti);
  const tl = document.getElementById('tl_' + phId + '_' + ti);
  if (cb) cb.classList.toggle('done', !!saved[key]);
  if (tl) tl.classList.toggle('done', !!saved[key]);
  updateStats();
}

function togglePhase(phId) {
  const body = document.getElementById('body_' + phId);
  const chev = document.getElementById('chev_' + phId);
  if (!body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  if (chev) chev.classList.toggle('open', !isOpen);
}

function copyCmd(el, text) {
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    el.querySelector('.copy-hint').textContent = 'Copié !';
    setTimeout(() => {
      el.classList.remove('copied');
      el.querySelector('.copy-hint').textContent = 'copier';
    }, 1800);
  }).catch(() => {});
}

function resetAll() {
  if (!confirm('Réinitialiser toute la progression ?')) return;
  saved = {};
  persist();
  document.querySelectorAll('.cb').forEach(el => el.classList.remove('done'));
  document.querySelectorAll('.task-title').forEach(el => el.classList.remove('done'));
  updateStats();
}

const container = document.getElementById('phases-container');

PHASES.forEach((ph, pi) => {
  const phTotal = ph.tasks.length;
  const phDone = ph.tasks.filter((_, ti) => saved[ph.id + '_' + ti]).length;
  const phPct = phTotal ? Math.round(phDone / phTotal * 100) : 0;

  const wrap = document.createElement('div');
  wrap.className = 'phase-wrap';

  const header = document.createElement('div');
  header.className = 'phase-header';
  header.setAttribute('onclick', `togglePhase('${ph.id}')`);
  header.innerHTML = `
    <div class="phase-num" style="background:${ph.bg};color:${ph.textColor}">${pi + 1}</div>
    <div class="phase-title">${ph.label}</div>
    <span class="phase-hours">${ph.hours}</span>
    <span class="phase-pct" style="color:${ph.color}" id="ppct_${ph.id}">${phDone}/${phTotal}</span>
    <span class="chevron" id="chev_${ph.id}">›</span>`;

  const body = document.createElement('div');
  body.className = 'phase-body';
  body.id = 'body_' + ph.id;

  const progRow = document.createElement('div');
  progRow.className = 'phase-progress-row';
  progRow.innerHTML = `<div class="phase-progress-bg"><div class="phase-progress-fill" id="pbar_${ph.id}" style="width:${phPct}%;background:${ph.color}"></div></div>`;
  body.appendChild(progRow);

  if (ph.deliverables && ph.deliverables.length) {
    const delRow = document.createElement('div');
    delRow.className = 'deliverables';
    delRow.innerHTML = ph.deliverables.map(d => `<span class="del-badge">${d}</span>`).join('');
    body.appendChild(delRow);
  }

  ph.tasks.forEach((task, ti) => {
    const isDone = !!saved[ph.id + '_' + ti];
    const shortCmd = task.c.length > 72 ? task.c.slice(0, 72) + '…' : task.c;
    const row = document.createElement('div');
    row.className = 'task-row';
    row.setAttribute('onclick', `toggleTask('${ph.id}', ${ti})`);
    row.innerHTML = `
      <div class="cb ${isDone ? 'done' : ''}" id="cb_${ph.id}_${ti}">
        <span class="tick">✓</span>
      </div>
      <div class="task-info">
        <div class="task-title ${isDone ? 'done' : ''}" id="tl_${ph.id}_${ti}">${task.t}</div>
        <div class="cmd-box" onclick="event.stopPropagation();copyCmd(this,'${task.c.replace(/'/g, "\\'")}')">
          ${shortCmd}<span class="copy-hint">copier</span>
        </div>
      </div>`;
    body.appendChild(row);
  });

  wrap.appendChild(header);
  wrap.appendChild(body);
  container.appendChild(wrap);
});

updateStats();
togglePhase('p1');
</script>
</body>
</html>
