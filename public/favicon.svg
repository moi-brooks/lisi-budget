<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Red background square with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#CC3333"/>
  <!-- "L" letterform in white, clean and bold -->
  <text x="7" y="25" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="white" letter-spacing="-1">L</text>
  <!-- Small "i" accent in white -->
  <rect x="19" y="10" width="3" height="3" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="19" y="15" width="3" height="10" rx="1" fill="white" opacity="0.85"/>
</svg>
